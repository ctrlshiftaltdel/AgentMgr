name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit-validate:
    name: kit-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate kit (project-ready)
        run: python3 scripts/validate_kit.py --project-ready
      - name: Kit unit tests
        run: python3 -m unittest discover -s tests -v

  app-tests:
    name: app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ajaimgr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AJAIMGR_TEST_DB_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ajaimgr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run test suite
        run: uv run pytest app/tests -q -o addopts=""
