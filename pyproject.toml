[project]
name = "ajaimgr"
version = "0.1.0"
description = "中国大陆企业 Hermes Agent 原生管理系统（首期报销）"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic",
    "python-multipart",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.1",
    "jinja2>=3.1.6",
    "mcp==2.3.0",
    "wechatbot-sdk==0.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    # The MCP test client uses httpx2 directly (also a transitive mcp dep).
    "httpx2",
    # Contract-schema tests use JSON Schema Draft 2020-12 + FormatChecker.
    "jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"
